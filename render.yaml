# render.yaml — Blueprint Render pour student-dashboard
# Doc: https://render.com/docs/blueprint-spec

databases:
  - name: student-dashboard-db
    databaseName: academic_analytics
    user: student_user
    plan: free

services:
  # -----------------------------------------------------------------------
  # Backend Django
  # -----------------------------------------------------------------------
  - type: web
    name: student-dashboard-backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: student-dashboard-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://student-dashboard-frontend-z6x5.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # -----------------------------------------------------------------------
  # Frontend React (Vite) — servi comme site statique
  # -----------------------------------------------------------------------
  - type: web
    name: student-dashboard-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://student-dashboard-backend-0pvg.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
